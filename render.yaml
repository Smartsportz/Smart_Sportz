services:
  - type: web
    name: smart-sportz-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 1 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: Smart Sportz Backend
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_BACKEND
        value: postgres
      - key: DATABASE_PATH
        value: storage/smart_sportz.db
      - key: MIRROR_DATABASE_PATH
        value: storage/smart_sportz_mirror.db
      - key: AUDIT_DATABASE_PATH
        value: storage/smart_sportz_audit.db
      - key: DATABASE_URL
        value: postgresql://postgres.kuoclwkexuzmkepokite:Smartsportz$001@aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
