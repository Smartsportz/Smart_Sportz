services:
  - type: web
    name: smart-sportz-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_BACKEND
        value: sqlite
      - key: ALLOWED_ORIGINS
        value: https://smart-sportz.vercel.app,https://smartsportz.github.io,http://127.0.0.1:5173,http://localhost:5173
