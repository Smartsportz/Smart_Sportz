services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_sportz
      POSTGRES_USER: smart_sportz
      POSTGRES_PASSWORD: smart_sportz_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_sportz -d smart_sportz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - smart_sportz_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - smart_sportz_redis:/data

  backend-init:
    build:
      context: ./backend
    command: ["python", "-m", "app.cli", "init-db"]
    environment:
      APP_ENV: docker
      APP_SECRET_KEY: change-this-docker-secret
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      MIRROR_DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      AUDIT_DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      POSTGRES_PRIMARY_SCHEMA: primary_app
      POSTGRES_MIRROR_SCHEMA: mirror_backup
      POSTGRES_AUDIT_SCHEMA: audit_event
      REDIS_URL: redis://redis:6379/0
      INIT_DB_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: docker
      APP_SECRET_KEY: change-this-docker-secret
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      MIRROR_DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      AUDIT_DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      POSTGRES_PRIMARY_SCHEMA: primary_app
      POSTGRES_MIRROR_SCHEMA: mirror_backup
      POSTGRES_AUDIT_SCHEMA: audit_event
      REDIS_URL: redis://redis:6379/0
      INIT_DB_ON_STARTUP: "false"
      PUBLIC_CACHE_TTL_SECONDS: "45"
      DASHBOARD_CACHE_TTL_SECONDS: "20"
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      WEB_CONCURRENCY: "2"
    depends_on:
      backend-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.cli", "worker"]
    environment:
      APP_ENV: docker
      APP_SECRET_KEY: change-this-docker-secret
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      MIRROR_DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      AUDIT_DATABASE_URL: postgresql://smart_sportz:smart_sportz_local@postgres:5432/smart_sportz
      POSTGRES_PRIMARY_SCHEMA: primary_app
      POSTGRES_MIRROR_SCHEMA: mirror_backup
      POSTGRES_AUDIT_SCHEMA: audit_event
      REDIS_URL: redis://redis:6379/0
      INIT_DB_ON_STARTUP: "false"
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: /
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - smart_sportz_prometheus:/prometheus
    depends_on:
      - backend
      - frontend
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - smart_sportz_grafana:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  smart_sportz_postgres:
  smart_sportz_redis:
  smart_sportz_prometheus:
  smart_sportz_grafana:
