global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: smart-sportz-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: smart-sportz-frontend-nginx
    metrics_path: /metrics
    static_configs:
      - targets:
          - frontend:80
